[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cropspectai"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "sharana shivanand" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pip",
    "python-dotenv",
    "pyserial>=3.5",
    "ruff",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "tqdm",
    "typer",
    "xgboost>=3.4.1",
    "streamlit>=1.66.0",
]
requires-python = "~=3.14.0"


[tool.setuptools.packages.find]
where = ["ml/src"]
include = ["cropspectai*"]

[tool.ruff]
line-length = 99
src = ["ml/src"]
include = ["pyproject.toml", "ml/src/cropspectai/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cropspectai"]
force-sort-within-sections = true

