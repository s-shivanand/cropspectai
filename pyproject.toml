[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cropspectai"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "sharana shivanand" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["cropspectai"]
include = ["pyproject.toml", "cropspectai/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cropspectai"]
force-sort-within-sections = true

